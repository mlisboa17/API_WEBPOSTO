<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebPosto - Dashboard Consolidado</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>

  <!-- Babel (JSX transpiler) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Recharts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/recharts.min.js"></script>

  <!-- Lucide Icons (via CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .tab-button {
      transition: all 0.3s ease;
    }
    .tab-button.active {
      border-bottom-width: 2px;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { BarChart, Bar, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = recharts;
    const { AlertCircle, TrendingDown, DollarSign, Activity, Fuel, ShoppingCart } = lucide;

    const API_BASE = window.LOGOS_API_BASE || 'http://localhost:8000';
    const UNIDADE_OPTIONS = [
      { id: '1', label: 'Real' },
      { id: '2', label: 'Casa Caiada' },
      { id: '3', label: 'VIP' },
    ];
    const COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6'];

    // ============ DASHBOARD AUDITORIA ============
    function DashboardAuditoria() {
      const [unidadeSelecionada, setUnidadeSelecionada] = useState('1');
      const [data, setData] = useState(new Date().toISOString().split('T')[0]);
      const [resumo, setResumo] = useState(null);
      const [despesas, setDespesas] = useState([]);
      const [fechamentos, setFechamentos] = useState(null);
      const [comparativoUnidades, setComparativoUnidades] = useState([]);
      const [loading, setLoading] = useState(false);
      const [erro, setErro] = useState(null);
      const [avisoComparativo, setAvisoComparativo] = useState(null);

      useEffect(() => {
        carregarDados();
      }, [unidadeSelecionada, data]);

      const carregarDados = async () => {
        setLoading(true);
        setErro(null);
        setAvisoComparativo(null);
        const q = new URLSearchParams();
        if (data) q.set('data', data);
        const qs = q.toString() ? `?${q.toString()}` : '';

        try {
          const resumoUrl = `${API_BASE}/auditoria/resumo/${unidadeSelecionada}${qs}`;
          const resResumo = await fetch(resumoUrl);
          if (!resResumo.ok) {
            const t = await resResumo.text();
            throw new Error(`Resumo: HTTP ${resResumo.status} — ${t.slice(0, 240)}`);
          }
          setResumo(await resResumo.json());

          const resDes = await fetch(`${API_BASE}/auditoria/despesas/${unidadeSelecionada}${qs}`);
          if (resDes.ok) setDespesas(await resDes.json());
          else if (resDes.status === 404) setDespesas([]);
          else throw new Error(`Despesas: HTTP ${resDes.status}`);

          const resFech = await fetch(`${API_BASE}/auditoria/fechamentos/${unidadeSelecionada}${qs}`);
          if (resFech.ok) setFechamentos(await resFech.json());
          else if (resFech.status === 404) setFechamentos({ fechamentos: [] });
          else throw new Error(`Fechamentos: HTTP ${resFech.status}`);

          await carregarComparativo(qs);
        } catch (e) {
          setErro(e.message || String(e));
          setResumo(null);
          setDespesas([]);
          setFechamentos(null);
          setComparativoUnidades([]);
        } finally {
          setLoading(false);
        }
      };

      const carregarComparativo = async (qs) => {
        const erros = [];
        const dados = await Promise.all(
          UNIDADE_OPTIONS.map(async (u) => {
            try {
              const res = await fetch(`${API_BASE}/auditoria/resumo/${u.id}${qs}`);
              if (!res.ok) {
                erros.push(`${u.label}: HTTP ${res.status}`);
                return null;
              }
              return { ...(await res.json()), unidade_id: u.id, unidade_label: u.label };
            } catch (e) {
              erros.push(`${u.label}: ${e.message}`);
              return null;
            }
          })
        );
        setComparativoUnidades(dados.filter(Boolean));
        if (erros.length) setAvisoComparativo(erros.join(' · '));
      };

      const CardKpi = ({ titulo, valor, subtitulo, icon: Icon, alerta }) => (
        <div className={`bg-gray-900 border rounded-lg p-6 ${alerta ? 'border-red-500' : 'border-gray-700'}`}>
          <div className="flex justify-between items-start">
            <div>
              <p className="text-gray-400 text-sm font-medium">{titulo}</p>
              <p className="text-2xl font-bold text-white mt-2">{valor}</p>
              {subtitulo && <p className="text-gray-500 text-xs mt-1">{subtitulo}</p>}
            </div>
            <Icon className={`w-6 h-6 ${alerta ? 'text-red-500' : 'text-blue-500'}`} />
          </div>
        </div>
      );

      const TabelaMovimentacoes = () => {
        if (!fechamentos || !fechamentos.fechamentos || fechamentos.fechamentos.length === 0) {
          return <p className="text-gray-400 text-sm">Sem dados de movimentações</p>;
        }

        const movs = fechamentos.fechamentos[0]?.movimentacoes || [];
        return (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b border-gray-700">
                  <th className="text-left py-2 px-3 text-gray-400 font-medium">Espécie</th>
                  <th className="text-right py-2 px-3 text-gray-400 font-medium">Esperado</th>
                  <th className="text-right py-2 px-3 text-gray-400 font-medium">Informado</th>
                  <th className="text-right py-2 px-3 text-gray-400 font-medium">Diferença</th>
                  <th className="text-right py-2 px-3 text-gray-400 font-medium">Variação %</th>
                </tr>
              </thead>
              <tbody>
                {movs.map((mov, idx) => (
                  <tr key={idx} className="border-b border-gray-800 hover:bg-gray-800/50">
                    <td className="py-3 px-3 text-white capitalize">{mov.especie}</td>
                    <td className="py-3 px-3 text-right text-gray-300">R$ {mov.valor_esperado?.toFixed(2) || '0.00'}</td>
                    <td className="py-3 px-3 text-right text-gray-300">R$ {mov.valor_informado?.toFixed(2) || '0.00'}</td>
                    <td className={`py-3 px-3 text-right font-medium ${mov.diferenca > 0 ? 'text-red-400' : 'text-green-400'}`}>
                      R$ {mov.diferenca?.toFixed(2) || '0.00'}
                    </td>
                    <td className={`py-3 px-3 text-right font-medium ${Math.abs(mov.variacao_percentual) > 1 ? 'text-orange-400' : 'text-green-400'}`}>
                      {mov.variacao_percentual?.toFixed(2) || '0.00'}%
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      };

      const TabelaDespesas = () => {
        if (!despesas || despesas.length === 0) {
          return <p className="text-gray-400 text-sm">Sem despesas registradas</p>;
        }

        return (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b border-gray-700">
                  <th className="text-left py-2 px-3 text-gray-400 font-medium">Horário</th>
                  <th className="text-left py-2 px-3 text-gray-400 font-medium">Categoria</th>
                  <th className="text-right py-2 px-3 text-gray-400 font-medium">Valor</th>
                  <th className="text-left py-2 px-3 text-gray-400 font-medium">Operador</th>
                  <th className="text-center py-2 px-3 text-gray-400 font-medium">Doc</th>
                  <th className="text-left py-2 px-3 text-gray-400 font-medium">Status</th>
                </tr>
              </thead>
              <tbody>
                {despesas.map((desp, idx) => (
                  <tr key={idx} className={`border-b border-gray-800 hover:bg-gray-800/50 ${!desp.tem_documento ? 'bg-red-900/20' : ''}`}>
                    <td className="py-3 px-3 text-gray-300 text-xs">
                      {new Date(desp.horario).toLocaleTimeString('pt-BR')}
                    </td>
                    <td className="py-3 px-3 text-white capitalize">{desp.categoria?.replace('_', ' ') || 'N/A'}</td>
                    <td className="py-3 px-3 text-right text-gray-300">R$ {desp.valor?.toFixed(2) || '0.00'}</td>
                    <td className="py-3 px-3 text-gray-400 text-xs">{desp.operador || '-'}</td>
                    <td className="py-3 px-3 text-center">
                      {desp.tem_documento ? (
                        <span className="text-green-400 text-xs font-medium">✓</span>
                      ) : (
                        <span className="text-red-400 text-xs font-medium">✗</span>
                      )}
                    </td>
                    <td className="py-3 px-3">
                      <span className={`text-xs px-2 py-1 rounded ${
                        desp.status_justificativa === 'justificada' ? 'bg-green-900/40 text-green-400' : 'bg-yellow-900/40 text-yellow-400'
                      }`}>
                        {desp.status_justificativa || 'pendente'}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      };

      const PainelInsights = () => {
        if (!resumo) return null;

        const insights = [];

        if (resumo.outlier_unidade) {
          insights.push({
            tipo: 'warning',
            msg: `⚠️ Unidade outlier: desvio de ${resumo.desvio_percentual_media_despesas?.toFixed(1) || '0.0'}%`
          });
        }

        if (resumo.quebra_total > 10) {
          insights.push({
            tipo: 'critical',
            msg: `🔴 Quebra crítica: R$ ${resumo.quebra_total?.toFixed(2) || '0.00'}`
          });
        }

        if (resumo.despesas_sem_documento_total > 0) {
          insights.push({
            tipo: 'warning',
            msg: `📄 ${resumo.despesas_sem_documento_total} despesa(s) sem documento`
          });
        }

        if (insights.length === 0) {
          insights.push({
            tipo: 'success',
            msg: '✓ Sem anomalias detectadas'
          });
        }

        return (
          <div className="space-y-2">
            {insights.map((insight, idx) => (
              <div
                key={idx}
                className={`p-3 rounded border text-sm ${
                  insight.tipo === 'critical'
                    ? 'bg-red-900/20 border-red-700 text-red-300'
                    : insight.tipo === 'warning'
                    ? 'bg-yellow-900/20 border-yellow-700 text-yellow-300'
                    : 'bg-green-900/20 border-green-700 text-green-300'
                }`}
              >
                {insight.msg}
              </div>
            ))}
          </div>
        );
      };

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-2xl font-bold mb-4">Auditoria</h2>

            <div className="flex gap-4 items-end flex-wrap">
              <div>
                <label className="block text-sm font-medium text-gray-400 mb-2">Unidade</label>
                <select
                  value={unidadeSelecionada}
                  onChange={(e) => setUnidadeSelecionada(e.target.value)}
                  className="bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white text-sm"
                >
                  {UNIDADE_OPTIONS.map((u) => (
                    <option key={u.id} value={u.id}>{u.label}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-400 mb-2">Data</label>
                <input
                  type="date"
                  value={data}
                  onChange={(e) => setData(e.target.value)}
                  className="bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white text-sm"
                />
              </div>

              {loading && <p className="text-gray-400 text-sm">Carregando...</p>}
            </div>
          </div>

          {erro && (
            <div className="bg-red-900/20 border border-red-700 rounded p-3 text-red-300 text-sm">
              {erro}
            </div>
          )}

          {avisoComparativo && !erro && (
            <div className="bg-yellow-900/20 border border-yellow-700 rounded p-3 text-yellow-200 text-sm">
              Comparativo parcial: {avisoComparativo}
            </div>
          )}

          {resumo && (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              <CardKpi
                titulo="Faturamento Bruto"
                valor={`R$ ${resumo.faturamento_total?.toFixed(2) || '0.00'}`}
                subtitulo="Total do período"
                icon={DollarSign}
              />

              <CardKpi
                titulo="Despesas Operacionais"
                valor={`R$ ${resumo.despesas_operacionais?.toFixed(2) || '0.00'}`}
                subtitulo={`Desvio: ${resumo.desvio_percentual_media_despesas?.toFixed(1) || '0.0'}%`}
                icon={Activity}
              />

              <CardKpi
                titulo="Saldo em Espécie"
                valor={`R$ ${resumo.saldo_especie_total?.toFixed(2) || '0.00'}`}
                subtitulo={`${resumo.caixas_fechados || 0} caixas`}
                icon={DollarSign}
              />

              <CardKpi
                titulo="Quebra de Caixa"
                valor={`R$ ${resumo.quebra_total?.toFixed(2) || '0.00'}`}
                subtitulo={`${resumo.quebra_percentual?.toFixed(2) || '0.00'}%`}
                icon={TrendingDown}
                alerta={resumo.quebra_total > 10}
              />
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 space-y-6">
              <div className="bg-gray-900 border border-gray-700 rounded-lg p-6">
                <h3 className="text-lg font-semibold mb-4">Movimentação por Espécie</h3>
                <TabelaMovimentacoes />
              </div>

              <div className="bg-gray-900 border border-gray-700 rounded-lg p-6">
                <h3 className="text-lg font-semibold mb-4">Auditoria de Despesas</h3>
                <TabelaDespesas />
              </div>
            </div>

            <div className="bg-gray-900 border border-gray-700 rounded-lg p-6 h-fit">
              <h3 className="text-lg font-semibold mb-4 flex items-center gap-2">
                <AlertCircle className="w-5 h-5 text-yellow-500" />
                Insights
              </h3>
              <PainelInsights />
            </div>
          </div>
        </div>
      );
    }

    // ============ DASHBOARD ABASTECIMENTO ============
    function DashboardAbastecimento() {
      const [data, setData] = useState(new Date().toISOString().split('T')[0]);
      const [abastecimentos, setAbastecimentos] = useState([]);
      const [resumo, setResumo] = useState(null);
      const [loading, setLoading] = useState(false);
      const [erro, setErro] = useState(null);

      useEffect(() => {
        carregarDados();
      }, [data]);

      const carregarDados = async () => {
        setLoading(true);
        setErro(null);
        try {
          const r1 = await fetch(`${API_BASE}/abastecimento/resumo/${data}`);
          if (!r1.ok) {
            setAbastecimentos([]);
            setResumo(null);
            setErro(`Abastecimento indisponível nesta API (resumo: HTTP ${r1.status}). Use WebPosto_API com rotas /abastecimento.`);
            return;
          }
          setResumo(await r1.json());

          const r2 = await fetch(`${API_BASE}/abastecimento/data/${data}`);
          if (!r2.ok) {
            setAbastecimentos([]);
            setErro(`Lista de abastecimentos: HTTP ${r2.status}`);
            return;
          }
          const payload = await r2.json();
          setAbastecimentos(Array.isArray(payload) ? payload : payload.abastecimentos || []);
        } catch (e) {
          setErro(`Erro ao carregar abastecimento: ${e.message}`);
          setAbastecimentos([]);
          setResumo(null);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-2xl font-bold mb-4">Abastecimento</h2>

            <div className="flex gap-4 items-end flex-wrap">
              <div>
                <label className="block text-sm font-medium text-gray-400 mb-2">Data</label>
                <input
                  type="date"
                  value={data}
                  onChange={(e) => setData(e.target.value)}
                  className="bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white text-sm"
                />
              </div>

              {loading && <p className="text-gray-400 text-sm">Carregando...</p>}
            </div>
          </div>

          {erro && (
            <div className="bg-yellow-900/20 border border-yellow-700 rounded p-3 text-yellow-300 text-sm">
              ⚠️ {erro}
            </div>
          )}

          {resumo && (
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div className="bg-gray-900 border border-gray-700 rounded-lg p-6">
                <p className="text-gray-400 text-sm font-medium">Total Abastecido</p>
                <p className="text-2xl font-bold text-white mt-2">{resumo.total_abastecido || 0} L</p>
                <p className="text-gray-500 text-xs mt-1">Volume total</p>
              </div>

              <div className="bg-gray-900 border border-gray-700 rounded-lg p-6">
                <p className="text-gray-400 text-sm font-medium">Valor Total</p>
                <p className="text-2xl font-bold text-white mt-2">R$ {resumo.valor_total?.toFixed(2) || '0.00'}</p>
                <p className="text-gray-500 text-xs mt-1">Faturamento</p>
              </div>

              <div className="bg-gray-900 border border-gray-700 rounded-lg p-6">
                <p className="text-gray-400 text-sm font-medium">Transações</p>
                <p className="text-2xl font-bold text-white mt-2">{resumo.qtd_abastecimentos || 0}</p>
                <p className="text-gray-500 text-xs mt-1">Quantidade</p>
              </div>

              <div className="bg-gray-900 border border-gray-700 rounded-lg p-6">
                <p className="text-gray-400 text-sm font-medium">Ticket Médio</p>
                <p className="text-2xl font-bold text-white mt-2">R$ {resumo.ticket_medio?.toFixed(2) || '0.00'}</p>
                <p className="text-gray-500 text-xs mt-1">Por transação</p>
              </div>
            </div>
          )}

          <div className="bg-gray-900 border border-gray-700 rounded-lg p-6">
            <h3 className="text-lg font-semibold mb-4">Histórico de Abastecimentos</h3>
            {abastecimentos.length === 0 ? (
              <p className="text-gray-400 text-sm">Sem dados de abastecimentos para esta data</p>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="border-b border-gray-700">
                      <th className="text-left py-2 px-3 text-gray-400 font-medium">Horário</th>
                      <th className="text-left py-2 px-3 text-gray-400 font-medium">Combustível</th>
                      <th className="text-right py-2 px-3 text-gray-400 font-medium">Volume (L)</th>
                      <th className="text-right py-2 px-3 text-gray-400 font-medium">Valor (R$)</th>
                      <th className="text-right py-2 px-3 text-gray-400 font-medium">Preço/L</th>
                    </tr>
                  </thead>
                  <tbody>
                    {abastecimentos.map((abt, idx) => (
                      <tr key={idx} className="border-b border-gray-800 hover:bg-gray-800/50">
                        <td className="py-3 px-3 text-gray-300 text-xs">{abt.horario || 'N/A'}</td>
                        <td className="py-3 px-3 text-white">{abt.combustivel || 'Sem tipo'}</td>
                        <td className="py-3 px-3 text-right text-gray-300">{abt.volume || '0'}</td>
                        <td className="py-3 px-3 text-right text-gray-300">R$ {parseFloat(abt.valor || 0).toFixed(2)}</td>
                        <td className="py-3 px-3 text-right text-gray-300">R$ {parseFloat(abt.preco_litro || 0).toFixed(2)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============ DASHBOARD VENDAS ============
    function DashboardVendas() {
      const [data, setData] = useState(new Date().toISOString().split('T')[0]);
      const [vendas, setVendas] = useState([]);
      const [resumo, setResumo] = useState(null);
      const [loading, setLoading] = useState(false);
      const [erro, setErro] = useState(null);

      useEffect(() => {
        carregarDados();
      }, [data]);

      const carregarDados = async () => {
        setLoading(true);
        setErro(null);
        try {
          const r1 = await fetch(`${API_BASE}/vendas/resumo/${data}`);
          if (!r1.ok) {
            setVendas([]);
            setResumo(null);
            setErro(`Vendas indisponíveis nesta API (resumo: HTTP ${r1.status}). Use WebPosto_API com rotas /vendas.`);
            return;
          }
          setResumo(await r1.json());

          const r2 = await fetch(`${API_BASE}/vendas/data/${data}`);
          if (!r2.ok) {
            setVendas([]);
            setErro(`Lista de vendas: HTTP ${r2.status}`);
            return;
          }
          const payload = await r2.json();
          setVendas(Array.isArray(payload) ? payload : payload.vendas || []);
        } catch (e) {
          setErro(`Erro ao carregar vendas: ${e.message}`);
          setVendas([]);
          setResumo(null);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-2xl font-bold mb-4">Vendas</h2>

            <div className="flex gap-4 items-end flex-wrap">
              <div>
                <label className="block text-sm font-medium text-gray-400 mb-2">Data</label>
                <input
                  type="date"
                  value={data}
                  onChange={(e) => setData(e.target.value)}
                  className="bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white text-sm"
                />
              </div>

              {loading && <p className="text-gray-400 text-sm">Carregando...</p>}
            </div>
          </div>

          {erro && (
            <div className="bg-yellow-900/20 border border-yellow-700 rounded p-3 text-yellow-300 text-sm">
              ⚠️ {erro}
            </div>
          )}

          {resumo && (
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div className="bg-gray-900 border border-gray-700 rounded-lg p-6">
                <p className="text-gray-400 text-sm font-medium">Total Vendido</p>
                <p className="text-2xl font-bold text-white mt-2">R$ {resumo.total_vendido?.toFixed(2) || '0.00'}</p>
                <p className="text-gray-500 text-xs mt-1">Faturamento bruto</p>
              </div>

              <div className="bg-gray-900 border border-gray-700 rounded-lg p-6">
                <p className="text-gray-400 text-sm font-medium">Quantidade de Vendas</p>
                <p className="text-2xl font-bold text-white mt-2">{resumo.qtd_vendas || 0}</p>
                <p className="text-gray-500 text-xs mt-1">Transações</p>
              </div>

              <div className="bg-gray-900 border border-gray-700 rounded-lg p-6">
                <p className="text-gray-400 text-sm font-medium">Ticket Médio</p>
                <p className="text-2xl font-bold text-white mt-2">R$ {resumo.ticket_medio?.toFixed(2) || '0.00'}</p>
                <p className="text-gray-500 text-xs mt-1">Por transação</p>
              </div>

              <div className="bg-gray-900 border border-gray-700 rounded-lg p-6">
                <p className="text-gray-400 text-sm font-medium">Variação</p>
                <p className={`text-2xl font-bold mt-2 ${(resumo.variacao_percentual || 0) > 0 ? 'text-green-400' : 'text-red-400'}`}>
                  {resumo.variacao_percentual?.toFixed(1) || '0.0'}%
                </p>
                <p className="text-gray-500 text-xs mt-1">Vs período anterior</p>
              </div>
            </div>
          )}

          <div className="bg-gray-900 border border-gray-700 rounded-lg p-6">
            <h3 className="text-lg font-semibold mb-4">Histórico de Vendas</h3>
            {vendas.length === 0 ? (
              <p className="text-gray-400 text-sm">Sem dados de vendas para esta data</p>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="border-b border-gray-700">
                      <th className="text-left py-2 px-3 text-gray-400 font-medium">Horário</th>
                      <th className="text-left py-2 px-3 text-gray-400 font-medium">Produto</th>
                      <th className="text-right py-2 px-3 text-gray-400 font-medium">Quantidade</th>
                      <th className="text-right py-2 px-3 text-gray-400 font-medium">Valor Unit.</th>
                      <th className="text-right py-2 px-3 text-gray-400 font-medium">Total (R$)</th>
                      <th className="text-left py-2 px-3 text-gray-400 font-medium">Categoria</th>
                    </tr>
                  </thead>
                  <tbody>
                    {vendas.map((venda, idx) => (
                      <tr key={idx} className="border-b border-gray-800 hover:bg-gray-800/50">
                        <td className="py-3 px-3 text-gray-300 text-xs">{venda.horario || 'N/A'}</td>
                        <td className="py-3 px-3 text-white">{venda.produto || 'Sem produto'}</td>
                        <td className="py-3 px-3 text-right text-gray-300">{venda.quantidade || 0}</td>
                        <td className="py-3 px-3 text-right text-gray-300">R$ {parseFloat(venda.valor_unitario || 0).toFixed(2)}</td>
                        <td className="py-3 px-3 text-right text-white font-medium">R$ {parseFloat(venda.total || 0).toFixed(2)}</td>
                        <td className="py-3 px-3 text-gray-400 text-xs">{venda.categoria || '-'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============ MAIN APP WITH TABS ============
    function ConsolidatedDashboard() {
      const [activeTab, setActiveTab] = useState('auditoria');

      const tabs = [
        { id: 'auditoria', label: 'Auditoria', icon: AlertCircle },
        { id: 'abastecimento', label: 'Abastecimento', icon: Fuel },
        { id: 'vendas', label: 'Vendas', icon: ShoppingCart },
      ];

      const TabButton = ({ tab }) => (
        <button
          onClick={() => setActiveTab(tab.id)}
          className={`tab-button flex items-center gap-2 pb-3 px-4 border-b-2 transition-all ${
            activeTab === tab.id
              ? 'text-blue-400 border-blue-500'
              : 'text-gray-400 border-transparent hover:text-gray-300'
          }`}
        >
          <tab.icon className="w-4 h-4" />
          {tab.label}
        </button>
      );

      return (
        <div className="min-h-screen bg-gray-950 text-white p-6">
          <div className="max-w-7xl mx-auto">
            {/* Header */}
            <div className="mb-8">
              <h1 className="text-4xl font-bold mb-2">WebPosto</h1>
              <p className="text-gray-400">Dashboard Consolidado de Operações</p>
            </div>

            {/* Tabs Navigation */}
            <div className="border-b border-gray-700 mb-8">
              <div className="flex gap-1 overflow-x-auto">
                {tabs.map((tab) => (
                  <TabButton key={tab.id} tab={tab} />
                ))}
              </div>
            </div>

            {/* Tab Content */}
            <div className="bg-gray-950">
              {activeTab === 'auditoria' && <DashboardAuditoria />}
              {activeTab === 'abastecimento' && <DashboardAbastecimento />}
              {activeTab === 'vendas' && <DashboardVendas />}
            </div>

            {/* Footer */}
            <div className="mt-12 text-center text-gray-600 text-xs border-t border-gray-700 pt-6">
              <p>WebPosto v1.0 • Dashboard Consolidado • API: {API_BASE}</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ConsolidatedDashboard />);
  </script>
</body>
</html>
