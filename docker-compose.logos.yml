# Stack mínima: só a API Logos Auditoria (servicos_auditoria).
# Funciona sem Mongo/Redis/nginx — ideal para validar health e /docs locais.
#
# Uso:
#   docker compose -f docker-compose.logos.yml up --build -d
#   curl http://localhost:8000/auditoria/health
#
# Coloque URL e token reais no .env da raiz. Para subir sem WebPosto acessível:
#   WEBPOSTO_STRICT_STARTUP=false

services:
  auditoria:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-auditoria-api
    ports:
      - "8000:8000"
    # Usa o .env da raiz do projeto (já tens — tudo entra no container)
    env_file:
      - .env
    environment:
      # Só define default se não existir no .env (interpolação lê o .env na máquina)
      WEBPOSTO_STRICT_STARTUP: ${WEBPOSTO_STRICT_STARTUP:-false}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auditoria/health', timeout=5).read()",
        ]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
