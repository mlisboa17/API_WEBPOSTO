    <script>
      (function () {
        function showBootError(message) {
          var el = document.getElementById("bootStatus");
          if (!el) return;
          el.className = "state error";
          el.textContent = message;
        }

        window.addEventListener("error", function (event) {
          var detail = event && event.message ? event.message : "erro desconhecido";
          showBootError("Falha ao carregar a interface: " + detail);
        });

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason ? event.reason : "erro desconhecido";
          var detail = typeof reason === "string" ? reason : reason && reason.message ? reason.message : String(reason);
          showBootError("Falha ao iniciar a interface: " + detail);
        });

        window.setTimeout(function () {
          if (window.__LOGOS_APP_READY) return;
          showBootError(
            "Interface não iniciou. Abra http://127.0.0.1:8040/app/financial com a API em execução e recarregue com Ctrl+F5."
          );
        }, 8000);
      })();
    </script>
