<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Center — LOGOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #888;
            font-size: 14px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
        }
        
        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        
        .card-value {
            font-size: 36px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        
        .card-change {
            font-size: 13px;
            color: #4ade80;
        }
        
        .card-change.negative {
            color: #f87171;
        }
        
        .table-container {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead th {
            text-align: left;
            padding: 12px;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            border-bottom: 1px solid #2a2a2a;
        }
        
        tbody td {
            padding: 16px 12px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
        }
        
        tbody tr:hover {
            background: #222;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-critical {
            background: #dc2626;
            color: white;
        }
        
        .badge-high {
            background: #ea580c;
            color: white;
        }
        
        .badge-medium {
            background: #f59e0b;
            color: white;
        }
        
        .badge-low {
            background: #10b981;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        
        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔒 Security Center</h1>
            <p class="subtitle">Eventos de segurança e monitoramento</p>
        </header>
        
        <!-- KPIs -->
        <div class="grid">
            <div class="card">
                <div class="card-title">Eventos Últimas 24h</div>
                <div class="card-value" id="events-24h">-</div>
                <div class="card-change">Carregando...</div>
            </div>
            
            <div class="card">
                <div class="card-title">Eventos Críticos</div>
                <div class="card-value" id="critical-events">-</div>
                <div class="card-change negative">Requer atenção</div>
            </div>
            
            <div class="card">
                <div class="card-title">Falhas de Login</div>
                <div class="card-value" id="login-failures">-</div>
                <div class="card-change">Últimas 24h</div>
            </div>
            
            <div class="card">
                <div class="card-title">IPs Bloqueados</div>
                <div class="card-value" id="blocked-ips">-</div>
                <div class="card-change">Ativos</div>
            </div>
        </div>
        
        <!-- Tabela de Eventos -->
        <div class="table-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-size: 18px; font-weight: 600;">Eventos Recentes</h2>
                <button class="btn" onclick="loadSecurityEvents()">Atualizar</button>
            </div>
            
            <div id="events-table">
                <div class="loading">Carregando eventos...</div>
            </div>
        </div>
    </div>
    
    <script>
        // Configuração
        const API_BASE = 'http://127.0.0.1:8040';
        const TENANT = 'POSTO_VIP'; // TODO: pegar do contexto do usuário
        
        // Carregar dados ao iniciar
        document.addEventListener('DOMContentLoaded', () => {
            loadSecurityEvents();
            loadKPIs();
        });
        
        // Carregar KPIs
        async function loadKPIs() {
            try {
                // TODO: endpoint real de KPIs de segurança
                // Por ora, valores fictícios
                document.getElementById('events-24h').textContent = '127';
                document.getElementById('critical-events').textContent = '3';
                document.getElementById('login-failures').textContent = '12';
                document.getElementById('blocked-ips').textContent = '2';
            } catch (error) {
                console.error('Erro ao carregar KPIs:', error);
            }
        }
        
        // Carregar eventos de segurança
        async function loadSecurityEvents() {
            const container = document.getElementById('events-table');
            container.innerHTML = '<div class="loading">Carregando eventos...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/v1/governance/security/events?tenant=${TENANT}&limit=50`);
                const data = await response.json();
                
                if (!data.success || data.count === 0) {
                    container.innerHTML = '<div class="loading">Nenhum evento de segurança registrado.</div>';
                    return;
                }
                
                // Criar tabela
                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Data/Hora</th>
                                <th>Tipo</th>
                                <th>Severidade</th>
                                <th>Descrição</th>
                                <th>IP</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                data.events.forEach(event => {
                    const date = new Date(event.created_at).toLocaleString('pt-BR');
                    const severityClass = `badge-${event.severity.toLowerCase()}`;
                    
                    html += `
                        <tr>
                            <td>${date}</td>
                            <td>${event.event_type}</td>
                            <td><span class="badge ${severityClass}">${event.severity}</span></td>
                            <td>${event.description}</td>
                            <td>${event.ip_address || '-'}</td>
                            <td>${event.action_taken || '-'}</td>
                        </tr>
                    `;
                });
                
                html += `
                        </tbody>
                    </table>
                `;
                
                container.innerHTML = html;
            } catch (error) {
                console.error('Erro ao carregar eventos:', error);
                container.innerHTML = '<div class="loading">Erro ao carregar eventos. Verifique o console.</div>';
            }
        }
    </script>
</body>
</html>
