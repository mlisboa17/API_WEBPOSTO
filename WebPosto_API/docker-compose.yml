version: "3.9"

services:
  valkey-cache:
    image: valkey/valkey:8-alpine
    container_name: logos-valkey-audit
    command: valkey-server --appendonly yes
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_audit_data:/data
    networks:
      - webposto-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  postgres-db:
    image: postgres:17-alpine
    container_name: logos-db-audit
    restart: unless-stopped
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pg_audit_data:/var/lib/postgresql/data
    networks:
      - webposto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d audit_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webposto-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WEBPOSTO_BASE_URL: ${WEBPOSTO_BASE_URL:-https://web.qualityautomacao.com.br}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./webposto.db}
      REDIS_URL: redis://valkey-cache:6379/0
      VALKEY_URL: redis://valkey-cache:6379/0
      CELERY_BROKER_URL: redis://valkey-cache:6379/1
      API_PORT: 8040
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8040:8040"
    depends_on:
      valkey-cache:
        condition: service_healthy
    networks:
      - webposto-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webposto-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://valkey-cache:6379/0
      CELERY_BROKER_URL: redis://valkey-cache:6379/1
    command: ["celery", "-A", "src.infrastructure.background.celery_app:celery_app", "worker", "-l", "info"]
    depends_on:
      valkey-cache:
        condition: service_healthy
    networks:
      - webposto-network
    profiles:
      - worker

networks:
  webposto-network:
    driver: bridge

volumes:
  valkey_audit_data:
  pg_audit_data:
