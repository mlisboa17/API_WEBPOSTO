version: '3.9'

services:
  # WebPosto API (unified service)
  api:
    build:
      context: .
      dockerfile: Dockerfile.webposto
    container_name: webposto-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Legacy Logos Auditoria API
      WEBPOSTO_BASE_URL: ${WEBPOSTO_BASE_URL}
      WEBPOSTO_BEARER_TOKEN: ${WEBPOSTO_BEARER_TOKEN}
      # false = sobe mesmo sem WebPosto (útil para dev). Produção: true no .env
      WEBPOSTO_STRICT_STARTUP: ${WEBPOSTO_STRICT_STARTUP:-false}
      LOGOS_EYE_ENABLED: ${LOGOS_EYE_ENABLED:-true}
      LOGOS_EYE_URL: http://logos-eye:5000
      LOGOS_SPACE_ENABLED: ${LOGOS_SPACE_ENABLED:-true}
      LOGOS_SPACE_DB: mongodb://mongo:27017/logos

      # New WebPosto API
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-webposto}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-webposto}"
      VALKEY_URL: redis://valkey:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000

      # Common
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - logos-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auditoria/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  # Frontend (Vite dev server) - development convenience service
  frontend:
    image: node:18-alpine
    container_name: webposto-frontend
    working_dir: /app
    volumes:
      - ./frontend/react-vite:/app
      - /app/node_modules
    ports:
      - "3000:5173" # Expose Vite dev server on localhost:3000
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
      - redis
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0"
    networks:
      - logos-network
    restart: unless-stopped

  # MongoDB (Logos Space + WebPosto)
  mongo:
    image: mongo:7.0
    container_name: webposto-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: logos
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - logos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postgres (Primary relational DB for WebPosto)
  postgres:
    image: postgres:17-alpine
    container_name: webposto-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webposto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-webposto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-webposto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey (Redis-compatible key-value store used as session/caching layer)
  valkey:
    image: redis:7-alpine
    container_name: webposto-valkey
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - valkey_data:/data
    networks:
      - logos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache)
  redis:
    image: redis:7-alpine
    container_name: logos-cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - logos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx (Reverse Proxy + Dashboard)
  nginx:
    image: nginx:alpine
    container_name: webposto-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./dashboard_dist:/usr/share/nginx/html/dist:ro
    depends_on:
      - api
    networks:
      - logos-network
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: webposto-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - logos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana (Dashboards + Monitoring)
  grafana:
    image: grafana/grafana:latest
    container_name: webposto-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: 'grafana-clock-panel'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - logos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  logos-network:
    driver: bridge

volumes:
  mongo_data:
  mongo_config:
  redis_data:
  prometheus_data:
  grafana_data:
  postgres_data:
  valkey_data:
