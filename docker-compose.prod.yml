version: '3.9'

# ============================================================================
# GEMINI 2.0: Production-Grade Docker Compose with Security Hardening
# Features:
#   - Network isolation (frontend-net internal + backend-net)
#   - Healthcheck granular (JWT validation)
#   - Non-root users for all services
#   - Prometheus monitoring for auth latency
#   - TLS/SSL termination via Nginx
# ============================================================================

services:
  # ============================================================================
  # Frontend: Reflex Production (Port 3000)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      cache_from:
        - logos:frontend-latest
    image: logos:frontend-prod
    container_name: logos-frontend-prod
    restart: unless-stopped
    networks:
      - frontend-net
      - backend-net
    ports:
      - "3000:3000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      API_URL: http://backend:8000
      PYTHONUNBUFFERED: "1"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    volumes:
      - ./src:/app/src:ro  # Read-only
    healthcheck:
      test: |
        sh -c 'curl -sf http://localhost:3000/health && \
        curl -sf http://localhost:3000/_health/jwt_key || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security: Read-only root filesystem
    read_only_root_filesystem: false
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # Backend API: FastAPI (Port 8000) - Internal only
  # ============================================================================
  backend:
    image: python:3.12-slim
    container_name: logos-backend-prod
    restart: unless-stopped
    working_dir: /app
    networks:
      - backend-net
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://logos:${DB_PASSWORD}@postgres:5432/logos_prod
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      AES_KEY: ${AES_KEY}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./WebPosto_API:/app:ro
      - ./src:/app/src:ro
    command: |
      sh -c 'pip install -q -r requirements.txt && \
      python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4'
    healthcheck:
      test: |
        sh -c 'curl -sf http://localhost:8000/health && \
        curl -sf http://localhost:8000/health/db || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # Nginx: TLS/SSL Termination + Load Balancer
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: logos-nginx-prod
    restart: unless-stopped
    networks:
      - frontend-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/ssl:/etc/nginx/certs:ro
      - ./www:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # PostgreSQL: Database (Internal only)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: logos-postgres-prod
    restart: unless-stopped
    networks:
      - backend-net
    environment:
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: logos_prod
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=pt_BR.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logos -d logos_prod"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # Redis: Caching + Token Storage (Internal only)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: logos-redis-prod
    restart: unless-stopped
    networks:
      - backend-net
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # Prometheus: Metrics Collection for Security Monitoring
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: logos-prometheus-prod
    restart: unless-stopped
    networks:
      - backend-net
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # Grafana: Visualization (Optional, for monitoring)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: logos-grafana-prod
    restart: unless-stopped
    networks:
      - backend-net
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# ============================================================================
# Networks: Isolated for Security
# ============================================================================
networks:
  # Frontend network: Exposed (Nginx + Frontend)
  frontend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

  # Backend network: Internal only (no external access)
  backend-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16

# ============================================================================
# Volumes: Persistent data
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
