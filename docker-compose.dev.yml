version: '3.9'

services:
  # ===== PostgreSQL 17 =====
  postgres:
    image: postgres:17-alpine
    container_name: webposto_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webposto
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webposto_network

  # ===== Redis 8 (ou Valkey) =====
  redis:
    image: redis:8-alpine
    container_name: webposto_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webposto_network

  # ===== FastAPI Application =====
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: webposto_app
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:password@postgres:5432/webposto"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: development
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    command: >
      bash -c "python -m pip install -q --no-cache-dir -r requirements.txt &&
               python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - webposto_network

  # ===== Adminer (Lightweight DB Admin UI) =====
  adminer:
    image: adminer:latest
    container_name: webposto_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - webposto_network
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # ===== PgAdmin (Full-featured DB Admin UI) =====
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: webposto_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      SCRIPT_NAME: /pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - webposto_network
    profiles:
      - admin  # docker-compose --profile admin up

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  webposto_network:
    driver: bridge
