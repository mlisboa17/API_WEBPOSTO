"""
Configuração Valkey para sistema multi-tenant.

Utiliza dois modos:
1. Valkey Master: Operações simples, não-cluster
2. Valkey Cluster: Alta concorrência, distribuição
"""

# ============ VALKEY MASTER CONFIG (6379) ============
port 6379
databases 16
maxmemory 512mb
maxmemory-policy allkeys-lru
save 900 1
appendonly yes
appendfilename "appendonly.aof"
loglevel notice
logfile "/var/log/valkey/valkey-server.log"

# Replication
replica-read-only yes
replica-priority 100

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Cliente
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Persistência
auto-save-duration 900
rdb-compression yes
rdb-checksum yes
stop-writes-on-bgsave-error yes

# AOF Rewrite
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-rewrite-incremental-fsync yes

# ============ VALKEY CLUSTER CONFIG (6380-6382) ============
# Nota: Cada nó terá sua própria config com port diferente

# cluster-enabled yes
# cluster-config-file nodes-6380.conf
# cluster-node-timeout 5000
# cluster-replica-validity-factor 10
# cluster-migration-barrier 1
