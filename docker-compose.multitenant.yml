version: '3.9'

services:
  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEBUG=true
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=webposto_multitenant
      - REDIS_URL=redis://valkey-master:6379/0
      - REDIS_CLUSTER=redis://valkey-cluster-node-1:6379,redis://valkey-cluster-node-2:6379,redis://valkey-cluster-node-3:6379
      - LOG_LEVEL=INFO
      - PROMETHEUS_PORT=9091
    depends_on:
      - mongo
      - valkey-master
      - valkey-cluster-node-1
      - valkey-cluster-node-2
      - valkey-cluster-node-3
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    networks:
      - webposto_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MongoDB (Primary + Replica Set for High Availability)
  mongo:
    image: mongo:7.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=senha123
      - MONGO_INITDB_DATABASE=webposto_multitenant
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "27017:27017"
    networks:
      - webposto_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey Master (Single Node for Non-Cluster Operations)
  valkey-master:
    image: valkey/valkey:7.2
    command: valkey-server /etc/valkey/valkey.conf
    ports:
      - "6379:6379"
    volumes:
      - ./docker/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
      - valkey_master_data:/data
    networks:
      - webposto_network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey Cluster Node 1
  valkey-cluster-node-1:
    image: valkey/valkey:7.2
    command: valkey-server --port 6380 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    ports:
      - "6380:6380"
    volumes:
      - valkey_node1_data:/data
    networks:
      - webposto_network

  # Valkey Cluster Node 2
  valkey-cluster-node-2:
    image: valkey/valkey:7.2
    command: valkey-server --port 6381 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    ports:
      - "6381:6381"
    volumes:
      - valkey_node2_data:/data
    networks:
      - webposto_network

  # Valkey Cluster Node 3
  valkey-cluster-node-3:
    image: valkey/valkey:7.2
    command: valkey-server --port 6382 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    ports:
      - "6382:6382"
    volumes:
      - valkey_node3_data:/data
    networks:
      - webposto_network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - webposto_network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - webposto_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - webposto_network

volumes:
  mongo_data:
  valkey_master_data:
  valkey_node1_data:
  valkey_node2_data:
  valkey_node3_data:
  prometheus_data:
  grafana_data:

networks:
  webposto_network:
    driver: bridge
